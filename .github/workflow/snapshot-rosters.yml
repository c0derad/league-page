name: Snapshot Fantasy Rosters

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Fantasy week to save"
        required: true
        default: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot Sleeper fantasy rosters
        env:
          SNAPSHOT_WEEK: ${{ inputs.week }}
        run: node scripts/snapshot-rosters.mjs

      - name: Commit roster history
        run: |
          git config user.name "Roster Czar Bot"
          git config user.email "actions@github.com"

          git add src/lib/data/rosterHistory.json

          if git diff --cached --quiet; then
            echo "No roster changes to commit."
          else
            git commit -m "Save Week ${{ inputs.week }} fantasy rosters"
            git push
          fi
