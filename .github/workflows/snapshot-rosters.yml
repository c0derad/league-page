name: Snapshot Fantasy Rosters

on:
  schedule:
    # Every Thursday at 14:00 UTC.
    # This is 9:00 AM Dallas during CDT
    # and 8:00 AM Dallas during CST.
    - cron: '0 14 * * 4'

  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Snapshot Sleeper fantasy rosters
        run: node scripts/snapshot-rosters.mjs

      - name: Commit roster history
        run: |
          git config user.name "Roster Czar Bot"
          git config user.email "actions@github.com"

          git add src/lib/data/rosterHistory.json

          if git diff --cached --quiet; then
            echo "No roster changes to commit."
          else
            git commit -m "Update weekly fantasy roster snapshot"
            git push
          fi
